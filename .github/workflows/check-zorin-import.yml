name: Validate Zorin SYSTEM V2 import helper
on:
  push:
    branches: [main]
    paths:
      - "tools/publish_system_v2_from_zorin.sh"
      - "tools/check_system_private_dirs.py"
      - "tools/test_system_private_dirs.py"
      - "tools/resume_system_v2_import.sh"
      - ".github/workflows/check-zorin-import.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-static-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash syntax check
        run: |
          bash -n tools/publish_system_v2_from_zorin.sh
          bash -n tools/resume_system_v2_import.sh
      - name: Test empty private placeholders and block sensitive content
        run: python3 tools/test_system_private_dirs.py
      - name: Regression - preserve original OEM whitespace
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          git -C "$temp" init -q
          mkdir -p "$temp/system" "$temp/metadata"
          printf "%s   " "OEM trailing whitespace" > "$temp/system/rom-file.txt"
          echo >> "$temp/system/rom-file.txt"
          echo "manifest clean" > "$temp/metadata/info.txt"
          echo "# ROM content remains unchanged" > "$temp/.gitattributes"
          git -C "$temp" add .
          git -C "$temp" diff --cached --check -- metadata .gitattributes
          if git -C "$temp" diff --cached --check -- system; then
            echo "::error::Regression fixture was not recognized as having whitespace"
            exit 1
          fi
          echo "PASS: verified generated metadata without altering OEM system bytes"
      - name: Check safe, inspect-only missing-image failure
        shell: bash
        run: |
          set -euo pipefail
          if bash tools/publish_system_v2_from_zorin.sh /tmp/definitely-not-system-v2-ALICE.img inspect; then
            echo "::error::Script unexpectedly accepted missing V2 image"
            exit 1
          fi
          echo "PASS: Bash parser and missing-image protection"
      - name: No extraction or upload during CI
        run: echo "No SYSTEM data present in CI. User executes this script on their Zorin laptop."
